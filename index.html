<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leitor de XML para Google Sheets</title>
    <!-- Carregando a API do Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://apis.google.com/js/api.js" async defer></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 550px;
            text-align: center;
        }
        h2 {
            font-family: 'Arial', sans-serif;
            font-size: 20px;
            color: #1e293b;
            margin-bottom: 10px;
        }
        p {
            font-family: 'Arial', sans-serif;
            font-size: 12px;
            color: #64748b;
            margin-bottom: 25px;
        }
        .file-drop-area {
            border: 2px dashed #cbd5e1;
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            background: #f8fafc;
            margin-bottom: 20px;
        }
        input[type="file"] {
            margin: 10px 0;
            width: 100%;
        }
        button {
            font-family: 'Arial', sans-serif;
            font-size: 12px;
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
            margin-top: 10px;
        }
        button:hover {
            background-color: #1d4ed8;
        }
        #authButton {
            background-color: #16a34a;
        }
        #authButton:hover {
            background-color: #15803d;
        }
        #status {
            margin-top: 20px;
            font-weight: bold;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Processador de XML para Google Sheets</h2>
        <p>Faça login com sua conta do Google e selecione os arquivos XML.</p>
        
        <button id="authButton" onclick="handleAuthClick()">1. Conectar com o Google</button>
        
        <div class="file-drop-area" style="margin-top: 20px;">
            <input type="file" id="xmlFile" accept=".xml" multiple>
        </div>
        
        <button onclick="processarEEnviarXMLs()">2. Enviar Dados para a Planilha</button>
        
        <div id="status"></div>
    </div>

    <script>
        const CLIENT_ID = '42116036229-fh2t0526tku7tjno7fl2bru36mopt9p7.apps.googleusercontent.com';
        const SPREADSHEET_ID = '1YgT0uNRsKYWWPmiaYwPU4qPx0t31H3yEF3ZV8GJAtME';
        const SCOPES = 'https://www.googleapis.com/auth/spreadsheets';

        let tokenClient;
        let gisInited = false;
        let gapiInited = false;

        window.onload = function () {
            gapi.load('client', intializeGapiClient);
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: SCOPES,
                callback: '', // Definido na hora da requisição
            });
            gisInited = true;
        };

        async function intializeGapiClient() {
            await gapi.client.init({
                discoveryDocs: ['https://sheets.googleapis.com/$discovery/rest?version=v4'],
            });
            gapiInited = true;
        }

        function handleAuthClick() {
            const statusDiv = document.getElementById('status');
            tokenClient.callback = async (resp) => {
                if (resp.error !== undefined) {
                    statusDiv.style.color = 'red';
                    statusDiv.innerText = 'Erro na autorização do Google.';
                    return;
                }
                statusDiv.style.color = 'green';
                statusDiv.innerText = 'Conectado ao Google com sucesso!';
            };

            // MODIFICAÇÃO: Removido o prompt de consentimento forçado para lembrar a conta
            tokenClient.requestAccessToken({ prompt: '' });
        }

        function pegarValorTag(doc, nomeTag) {
            let elemento = doc.getElementsByTagName(nomeTag)[0];
            return elemento ? elemento.textContent.trim() : "";
        }

        function pegarValorTagDentroDe(doc, tagPai, nomeTag) {
            let pai = doc.getElementsByTagName(tagPai)[0];
            if (pai) {
                let elemento = pai.getElementsByTagName(nomeTag)[0];
                return elemento ? elemento.textContent.trim() : "";
            }
            return "";
        }

        function formatarData(dataStr) {
            if (!dataStr) return "";
            let partesData = dataStr.split("T")[0].split("-");
            if (partesData.length === 3) {
                return `${partesData[2]}/${partesData[1]}/${partesData[0]}`;
            }
            return dataStr;
        }

        function obterMes(dataFmt) {
            if (!dataFmt) return "";
            let partes = dataFmt.split("/");
            if (partes.length === 3) {
                return partes[1];
            }
            return "";
        }

        function tratarNome(nomeOriginal) {
            let nomeUpper = nomeOriginal.toUpperCase();
            if (nomeUpper.includes("MAIRIBEL COSMETICOS LTDA") || nomeUpper.includes("MAIRIBEL")) {
                return "MAIRIBEL";
            }
            if (nomeUpper.includes("REFERENCE COLLOR LTDA") || nomeUpper.includes("REFERENCE")) {
                return "REFERENCE";
            }
            if (nomeUpper.includes("HIDRATYLIFE COSMETICOS LTDA") || nomeUpper.includes("HIDRATYLIFE")) {
                return "HIDRATYLIFE";
            }
            if (nomeUpper.includes("COLORMAKE COMERCIO DE COSMETICOS LTDA") || nomeUpper.includes("COLORMAKE")) {
                return "COLORMAKE";
            }
            return nomeOriginal;
        }

        function formatarMoedaBR(valorStr) {
            if (!valorStr) return "";
            let num = parseFloat(valorStr);
            if (isNaN(num)) return valorStr;
            return num.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        async function processarEEnviarXMLs() {
            const fileInput = document.getElementById('xmlFile');
            const statusDiv = document.getElementById('status');

            if (!gapi.client.getToken()) {
                statusDiv.style.color = 'red';
                statusDiv.innerText = 'Por favor, clique em "Conectar com o Google" primeiro!';
                return;
            }

            if (fileInput.files.length === 0) {
                statusDiv.style.color = 'red';
                statusDiv.innerText = 'Selecione ao menos um arquivo XML!';
                return;
            }

            statusDiv.style.color = '#333';
            statusDiv.innerText = 'Processando e enviando para a planilha...';

            let linhasParaEnviar = [];

            try {
                for (let file of fileInput.files) {
                    const textoXML = await file.text();
                    const parser = new DOMParser();
                    const xmlDoc = parser.parseFromString(textoXML, "text/xml");

                    let dataBruta = pegarValorTag(xmlDoc, "dhEmi");
                    let dataEmissao = formatarData(dataBruta); 
                    let mesEmissao = obterMes(dataEmissao);    
                    
                    let nomeBruto = pegarValorTag(xmlDoc, "xNome");
                    let fornecedorTratado = tratarNome(nomeBruto);
                    
                    let numeroNota = pegarValorTag(xmlDoc, "nNF");
                    
                    let valorTotalBruto = pegarValorTagDentroDe(xmlDoc, "ICMSTot", "vNF");
                    if (!valorTotalBruto) valorTotalBruto = pegarValorTag(xmlDoc, "vNF");
                    let valorTotalFormatado = formatarMoedaBR(valorTotalBruto);

                    let valorDescontoFormatado = "";
                    if (!fornecedorTratado.toUpperCase().includes("COLORMAKE")) {
                        let valorDescBruto = pegarValorTagDentroDe(xmlDoc, "ICMSTot", "vDesc");
                        valorDescontoFormatado = formatarMoedaBR(valorDescBruto);
                    }

                    let colA = "fornecedor";                       
                    let colB = dataEmissao;                          
                    let colC = mesEmissao;                           
                    let colD = fornecedorTratado;                    
                    let colE = numeroNota;                           
                    let colF = valorTotalFormatado;                  
                    let colG = valorDescontoFormatado;               
                    let colH = "ABERTO";                             
                    
                    let dataCurta = dataEmissao.substring(0, 5);     
                    let colI = `PEDIDO ${dataCurta} INTER PJ`;       

                    // Ordem exata das Colunas de A até I
                    linhasParaEnviar.push([colA, colB, colC, colD, colE, colF, colG, colH, colI]);
                }

                if (linhasParaEnviar.length > 0) {
                    // Requisição para adicionar as linhas no final da planilha do Google Drive
                    const response = await gapi.client.sheets.spreadsheets.values.append({
                        spreadsheetId: SPREADSHEET_ID,
                        range: 'A1', // A API detecta o final automaticamente com base na última linha preenchida
                        valueInputOption: 'USER_ENTERED',
                        resource: {
                            values: linhasParaEnviar
                        }
                    });

                    statusDiv.style.color = 'green';
                    statusDiv.innerText = 'Sucesso! Dados enviados direto para a sua planilha do Google Drive.';
                } else {
                    statusDiv.style.color = 'red';
                    statusDiv.innerText = 'Nenhum dado válido encontrado.';
                }

            } catch (error) {
                console.error(error);
                statusDiv.style.color = 'red';
                statusDiv.innerText = 'Ocorreu um erro ao enviar. Verifique o console (F12).';
            }
        }
    </script>
</body>
</html>
